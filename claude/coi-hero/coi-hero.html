<title>COI Hero</title>
<style>
/* Layout: app header with section tabs, a demo/storage strip, then one column of cards (max 1100px).
   Palette and type follow the server app: brand blue on slate, system UI font. */
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --sunken: #f1f5f9;
  --fg: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --accent: #2247d9;
  --accent-soft: #eef4ff;
  --accent-fg: #ffffff;
  --red: #b91c1c;   --red-soft: #fee2e2;
  --amber: #a16207; --amber-soft: #fef3c7;
  --green: #047857; --green-soft: #d1fae5;
  --grey: #475569;  --grey-soft: #f1f5f9;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1120; --surface: #111a2e; --sunken: #0e1628; --fg: #e2e8f0; --muted: #94a3b8; --line: #1f2b44;
  --accent: #7b9cff; --accent-soft: #18244a; --accent-fg: #0b1120;
  --red: #fca5a5; --red-soft: #3b1418; --amber: #fcd34d; --amber-soft: #3a2a0c;
  --green: #6ee7b7; --green-soft: #0c3326; --grey: #cbd5e1; --grey-soft: #1e293b;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #111a2e; --sunken: #0e1628; --fg: #e2e8f0; --muted: #94a3b8; --line: #1f2b44;
  --accent: #7b9cff; --accent-soft: #18244a; --accent-fg: #0b1120;
  --red: #fca5a5; --red-soft: #3b1418; --amber: #fcd34d; --amber-soft: #3a2a0c;
  --green: #6ee7b7; --green-soft: #0c3326; --grey: #cbd5e1; --grey-soft: #1e293b;
  color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
* { box-sizing: border-box; }
h1 { font-size: 24px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 15px; margin: 0 0 8px; }
.h3 { font-size: 15px; margin: 0; }
h3.label, .label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.strong { font-weight: 600; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.wrap { overflow-wrap: anywhere; min-width: 0; }
.grow { flex: 1; }
.t-red { color: var(--red); } .t-amber { color: var(--amber); }

.app { min-height: 100%; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; padding-inline: 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); font-weight: 900; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; }
.tab { font: inherit; font-weight: 500; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--sunken); color: var(--fg); }
.tab.on { background: var(--accent-soft); color: var(--accent); }
.banner { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding-block: 8px; padding-inline: 16px; background: var(--amber-soft); color: var(--fg); font-size: 13px; border-bottom: 1px solid var(--line); }
.banner strong { color: var(--amber); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
main { max-width: 1100px; margin: 0 auto; padding-block: 24px 64px; padding-inline: 16px; }
.stack { display: grid; gap: 16px; }
.pagehead { display: grid; gap: 4px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.center { justify-content: center; }
.row.tight { gap: 6px; flex-wrap: nowrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.wraprow { flex-wrap: wrap; align-items: flex-end; }
.sechead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sechead h2 { margin: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card.flush { padding: 0; }
.card.empty { text-align: center; display: grid; gap: 8px; padding: 32px 16px; }
.intro ul { margin: 0 0 12px; padding-left: 18px; display: grid; gap: 6px; max-width: 75ch; }
.prose p + p { margin-top: 8px; }
.prose p { max-width: 75ch; }
.notice { background: var(--amber-soft); border-radius: 8px; padding: 10px 12px; }
.error { color: var(--red); margin-top: 6px; }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { font: inherit; font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.ghost:hover { background: var(--sunken); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.danger { background: var(--red); border-color: var(--red); color: var(--surface); }
.danger-text { color: var(--red) !important; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, .drop:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.linkish { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }

.badge, .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.s-expired, .p-red { background: var(--red-soft); color: var(--red); }
.s-expiring_soon, .p-amber { background: var(--amber-soft); color: var(--amber); }
.s-active, .p-green { background: var(--green-soft); color: var(--green); }
.s-unknown, .p-grey { background: var(--grey-soft); color: var(--grey); }
.p-blue { background: var(--accent-soft); color: var(--accent); }

.review-bar { display: flex; align-items: center; gap: 14px; text-align: left; font: inherit; color: var(--fg); background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; cursor: pointer; }
.review-bar .count { display: grid; place-items: center; min-width: 44px; height: 44px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 20px; font-weight: 700; }
.columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.col { background: var(--surface); border: 1px solid var(--line); border-top-width: 4px; border-radius: var(--radius); min-width: 0; }
.c-red { border-top-color: var(--red); } .c-amber { border-top-color: var(--amber); } .c-green { border-top-color: var(--green); }
.colhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
.colcount { font-variant-numeric: tabular-nums; font-weight: 700; }
.collist { list-style: none; margin: 0; padding: 0; max-height: 26rem; overflow-y: auto; }
.collist li { padding: 9px 14px; border-bottom: 1px solid var(--line); }
.collist li:last-child { border-bottom: 0; }

.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.list > li:last-child { border-bottom: 0; }
.list.cards { display: grid; gap: 12px; }
.list.cards > li { border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 6px; }
.issues { margin: 2px 0 4px; padding-left: 18px; font-size: 13px; }
.issues .error { color: var(--red); } .issues .warning { color: var(--amber); }
.queue { margin-top: 12px; }
.queue .q-done strong::before { content: "✓ "; color: var(--green); }
.queue .q-failed, .queue .q-needs-you { color: var(--fg); }
.queue .q-failed .small { color: var(--red); } .queue .q-needs-you .small { color: var(--amber); }

.drop { display: grid; gap: 4px; place-items: center; text-align: center; padding: 36px 16px; border: 2px dashed var(--line); border-radius: var(--radius); background: var(--sunken); cursor: pointer; }
.drop strong { color: var(--accent); font-size: 15px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }

.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field.inline { min-width: 180px; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], select, textarea {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input.short { width: 90px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; }
.grid2.tight { gap: 10px; }
.card > .field, .card > .grid2 + .field { margin-top: 10px; }
.coverage, .rule { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; display: grid; gap: 10px; }
.coverage:first-of-type, .rule:first-of-type { border-top: 0; margin-top: 0; padding-top: 4px; }
.limits { display: grid; gap: 6px; }
.limitrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; gap: 6px; }
.limits > .btn { justify-self: start; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
td.num { white-space: nowrap; }

.pdfbox { display: grid; gap: 12px; background: var(--sunken); }
.pdf-page { width: 100%; max-width: 820px; height: auto; margin: 0 auto; border: 1px solid var(--line); background: #fff; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(560px, calc(100% - 32px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

@media (max-width: 800px) {
  .columns, .grid3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
